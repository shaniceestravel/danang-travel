function overview(){return `<section class="card"><div class="eyebrow">OUR LITTLE GETAWAY</div><h2>五天，三座城的故事</h2><p>2026年11月10日 — 14日<br>吉隆坡 → 岘港 → 会安 → 顺化 → 岘港 → 吉隆坡</p><div class="detail"><b>体验</b><span>遗产列车 · 竹篮船 · 灯笼 DIY · 香江游船 · 奥黛</span></div><div class="detail"><b>美食</b><span>巴拿山自助餐、顺化皇帝餐、海鲜烧烤自助餐、越南河粉、黄姜鱼米线、每人半只龙虾。具体用餐日期原资料未注明。</span></div>${flight(0)}${flight(4)}<button class="wide" id="print">打印 / 保存完整行程 PDF</button></section>${days.map((d,i)=>`<section class="card"><div class="eyebrow">${dates[i]} · DAY ${i+1}</div><h3>${d.title}</h3><button class="subtle" data-day="${i}">查看当日行程 ↗</button></section>`).join('')}`}

function render(){tabs.hidden=view!=='trip';document.querySelector('.nav').innerHTML=navItems.map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}" aria-current="${view===id?'page':'false'}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[id]}"/></svg>${label}</button>`).join('');if(view==='trip'){content.setAttribute('role','tabpanel');content.setAttribute('aria-labelledby',`date-${current}`);content.innerHTML=dayPage(current)}else{content.removeAttribute('role');content.removeAttribute('aria-labelledby');if(view==='overview')content.innerHTML=overview();if(view==='contacts')content.innerHTML=contactsPage();if(view==='saved')content.innerHTML=`<div class="section-label">COLLECTED MOMENTS · 我的收藏</div>`+(saved.length?saved.map(i=>summary(i)+`<button class="subtle" data-day="${i}" style="margin:0 0 18px">查看完整安排 ↗</button>`).join(''):'<div class="card empty"><h2>收藏你的期待</h2><p class="muted">点击每日卡片右上角的爱心，<br>将想回看的行程留在这里。</p></div>');if(view==='words')content.innerHTML='<section class="card"><div class="eyebrow">A FEW LOCAL WORDS</div><h2>旅途中，用得上的越南语</h2>'+[['Xin chào','你好'],['Cảm ơn','谢谢'],['Xin lỗi','对不起 / 不好意思'],['Bao nhiêu tiền?','多少钱？'],['Nhà vệ sinh ở đâu?','洗手间在哪里？']].map(([a,b])=>`<div class="phrase"><b>${a}</b><span>${b}</span></div>`).join('')+'</section>';if(view==='pack')content.innerHTML='<section class="card"><div class="eyebrow">BEFORE WE GO</div><h2>出发前，整理行囊</h2><p class="muted">勾选状态保存在当前浏览器。</p>'+['护照及入境所需材料','机票与行程单','确认航空公司行李额度','充电器与充电宝','舒适步行鞋','雨具与防晒用品','个人常用物品','出发前核对航班及接送安排'].map((s,i)=>`<label class="check"><input type="checkbox" data-check="${i}" ${checks.includes(i)?'checked':''}><span>${s}</span></label>`).join('')+'</section>'}content.innerHTML+='<div class="footer">VN5DAT · 5天4晚岘港遗产列车之旅<br>行程、酒店、餐食及交通以旅行社最终确认为准。</div>';tabs.querySelectorAll('button').forEach((b,i)=>{b.setAttribute('aria-selected',i===current);b.tabIndex=i===current?0:-1})}
dates.forEach((d,i)=>{let b=document.createElement('button');b.id=`date-${i}`;b.setAttribute('role','tab');b.setAttribute('aria-controls','content');b.innerHTML=`<b>${d}</b><small>D${i+1} · ${weekdays[i]}</small>`;b.onclick=()=>{current=i;render()};b.onkeydown=e=>{let n;if(e.key==='ArrowRight')n=(i+1)%5;if(e.key==='ArrowLeft')n=(i+4)%5;if(e.key==='Home')n=0;if(e.key==='End')n=4;if(n!==undefined){e.preventDefault();current=n;render();tabs.children[n].focus()}};tabs.append(b)});
document.addEventListener('click',e=>{const n=e.target.closest('[data-view]'),s=e.target.closest('[data-save]'),d=e.target.closest('[data-day]');if(n){view=n.dataset.view;render();window.scrollTo(0,0)}if(s){let i=Number(s.dataset.save);saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i];persist();render()}if(d){current=Number(d.dataset.day);view='trip';render();window.scrollTo(0,0)}if(e.target.id==='print')window.print()});document.addEventListener('change',e=>{if(e.target.matches('[data-check]')){let i=Number(e.target.dataset.check);checks=e.target.checked?[...new Set([...checks,i])]:checks.filter(x=>x!==i);persist()}});
window.addEventListener('beforeprint',()=>{content.innerHTML=days.map((d,i)=>dayPage(i)).join('')});window.addEventListener('afterprint',render);render();
</script></body></html>
